<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#grad1)" filter="url(#shadow)" />

  <!-- Globe / Translation Grid lines -->
  <circle cx="32" cy="32" r="18" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9" fill="none"/>
  <ellipse cx="32" cy="32" rx="18" ry="8" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" fill="none"/>
  <line x1="32" y1="14" x2="32" y2="50" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Translation Arrows & Flashcard Emblem -->
  <path d="M 22 28 L 42 28 M 36 22 L 42 28 L 36 34" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 42 38 L 22 38 M 28 32 L 22 38 L 28 44" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Anki Flashcard Badge -->
  <rect x="40" y="8" width="16" height="12" rx="3" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="44" y="17" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff">A</text>
</svg>
